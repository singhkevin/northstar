<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northstar · Frame C · Horizon</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
:root{--ink:#0E1013;--signal:#FFBA00}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#0F1724 0%,#1F2C40 34%,#4E5A6E 58%,#C98F6B 78%,#F2B98A 86%,#2A2622 86.2%,#15130F 100%);color:#fff;font-family:"Inter Tight",sans-serif}
.star{position:fixed;left:50%;top:12.5vh;transform:translateX(-50%);z-index:1;filter:drop-shadow(0 0 14px rgba(255,255,255,.7))}
canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:2}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:24px 44px;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;letter-spacing:-.03em}
nav{display:flex;gap:30px;font-size:14px;color:rgba(255,255,255,.75)}
.btn{background:#fff;color:var(--ink);border-radius:999px;padding:12px 22px;font-size:14px;font-weight:600}
.mono{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hero{position:fixed;left:0;right:0;top:150px;text-align:center;z-index:3}
.hero h1{font-weight:700;font-size:118px;letter-spacing:-.055em;line-height:.9}
.hero p{margin:22px auto 0;font-size:19px;line-height:1.45;color:rgba(255,255,255,.78);max-width:560px}
.ctas{display:flex;gap:12px;justify-content:center;margin-top:26px}
.ghost{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 22px;font-size:14px}
.chips{position:fixed;left:44px;right:44px;bottom:34px;display:flex;justify-content:space-between;align-items:end;z-index:5}
.chip{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 16px;font-size:13px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--signal)}
</style></head><body>
<img class="star" src="../brand/northstar-mark-white.svg" alt="" width="22" height="22">
<header>
  <img class="logo" src="../brand/northstar-compact-white.svg" alt="Northstar" style="height:24px;width:auto">
  <nav><span>Drones</span><span>Robotics</span><span>Platform</span><span>Industries</span><span>Company</span></nav>
  <span class="btn">Book a demo</span>
</header>
<div class="hero">
  <h1>Eyes on every site.</h1>
  <p>Drones in the air, robots on the ground and AI that turns what they see into decisions, run end to end by one team.</p>
  <div class="ctas"><span class="btn">Book a demo</span><span class="ghost">See how it works</span></div>
</div>
<canvas id="c"></canvas>
<div class="chips">
  <div style="display:flex;gap:10px"><span class="chip"><i></i>Aerial mapping</span><span class="chip"><i></i>Ground patrols</span><span class="chip"><i></i>AI insights</span></div>
  <span class="mono">Scroll to take off ↓</span>
</div>
<script type="module">
import * as THREE from 'three';
import { buildDrone, makeRenderer, studioEnv, animate } from './drone.js';
const renderer = makeRenderer(document.getElementById('c'), { exposure: 1 });
const scene = new THREE.Scene();
studioEnv(renderer, scene, 0.55);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.2, 12); camera.lookAt(0, -0.2, 0);
const sun = new THREE.DirectionalLight(0xffc49a, 3); sun.position.set(-2, 1.2, -8);
const fill = new THREE.DirectionalLight(0x9db4d8, 1.1); fill.position.set(3, 6, 8);
scene.add(sun, fill);
const drone = buildDrone({ shell: 0xe9e9e6, dark: 0x1a1c20 });
drone.position.set(0, -1.15, 0); drone.rotation.set(0.14, -0.3, 0.02);
drone.scale.setScalar(1.05);
scene.add(drone);
animate(renderer, scene, camera, drone, { bob: 0.1 });
</script>
</body></html>
